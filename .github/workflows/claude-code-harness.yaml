name: Claude Code hook harness

# Runs the opt-in Claude Code integration suite (tests/claude_code/) against a REAL headless
# `claude -p`, to catch drift in the hook contract camas depends on — that PostToolBatch fires on
# an edit and delivers the changed path on stdin, that ${file_path} is not interpolated, and that
# the shipped autofix hook actually runs the registered fix node end to end — and that the full
# plugin chain (install → edit → gate → fix) the camas-fixer subagent drives through the MCP tools
# works against a real Claude Code: camas mcp init --claude produces a loadable surface, the shipped
# PostToolBatch hook fires, and the fixer reaches green via the MCP camas_gate tool.
#
# It uses the same DeepSeek backend the agentic review workflow does (ANTHROPIC_BASE_URL +
# ANTHROPIC_AUTH_TOKEN=MODEL_API_KEY, a burner key with a hard spend cap), on the cheap
# deepseek-v4-flash tier.
on:
  workflow_dispatch:
  schedule:
    # Weekly. It reinstalls the claude-code the pin below names, so it cannot see a release change
    # the hook contract — what it does catch is drift in everything installed around that pin (uv,
    # the PyPI wheels, DeepSeek). Testing a new Claude Code means moving the pin, which is a file
    # edit and therefore its own push.
    - cron: "17 6 * * 1"
  push:
    # Branch pushes only: GitHub does not evaluate `paths` for tag pushes, so a release tag ran the
    # billed suite for a commit that touched no camas path at all. 0.1.25 through 0.1.29 each changed
    # only VERSION, so the branch push skipped the job exactly as the filter intends and the tag push
    # then ran it anyway.
    branches: ["**"]
    paths:
      - "src/camas/**"
      - "src/camas/main/claude_*.md"
      - "tests/claude_code/**"
      - "tests/plugin/**"
      - ".mcp.json"
      - ".claude/**"
      - ".github/workflows/claude-code-harness.yaml"

jobs:
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No approval rule on this environment, deliberately: this job's triggers never include
    # pull_request, so it only ever runs code that someone with write access pushed, or the schedule,
    # or a dispatch. An actor guard would add nothing, since agent pushes made with the maintainer's
    # token report the maintainer as github.actor, and spend stays bounded by the burner key's own
    # cap. MODEL_API_KEY is a repository secret — review.yaml reads it from a job that declares no
    # environment at all — so naming an environment here scopes nothing; it is the hook a future
    # approval rule would hang off. One was tried and removed (2026-08-05): it paused every run, and
    # taking it off *rejects* the runs already waiting on it rather than releasing them, so anything
    # that failed that way needs a re-run. The name existing is not itself evidence of a
    # configuration: referencing an environment that has been deleted silently re-creates it
    # unprotected.
    environment: model-api-e2e
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      # uv comes from PyPI (already allowlisted) rather than astral-sh/setup-uv, which resolves
      # versions via raw.githubusercontent.com and pulls the binary from releases.astral.sh — both
      # would need allowlisting. harden-runner enforces from its pre-step, so the lock covers setup
      # too regardless of step order; every host setup touches must be on the allowlist below.
      - name: Install uv (pinned)
        run: |
          pipx install --force uv==0.9.15
          pipx environment --value PIPX_BIN_DIR >> "$GITHUB_PATH"
      - run: uv --version

      - run: npm install -g @anthropic-ai/claude-code@2.1.197

      # Allowlist = the hosts setup (uv wheels from PyPI, claude-code from npm), the headless suite
      # (DeepSeek), and the suite's own inner `uv` invocations (which re-sync the full dev group,
      # actionlint-py included) reach; a blocked host shows in this step's summary.
      - name: Lock network egress
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deepseek.com:443
            pypi.org:443
            files.pythonhosted.org:443
            registry.npmjs.org:443
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      # The contract suite needs any interpreter >=3.10; --python 3.12 pins the runner's system
      # Python so uv does not download the .python-version default (3.14) from
      # release-assets.githubusercontent.com — on the allowlist above now, but the download itself
      # is still unneeded. UV_PYTHON_DOWNLOADS=never makes a missing one fail fast, before the
      # DeepSeek-billed run. --no-group lint drops actionlint-py from this invocation's own sync;
      # the suite's inner `uv run` calls (and the MCP launcher claude spawns) still sync the full
      # dev group, which is why actionlint-py's release-asset build also needed the host allowlisted.
      - name: Run the Claude Code integration suite
        env:
          CAMAS_CC_E2E: "1"
          CAMAS_CC_MODEL: deepseek-v4-flash
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MODEL_API_KEY }}
          # The camas-fixer subagent is model: haiku; point the haiku tier at DeepSeek so the
          # fixer-loop test (criterion #3) drives a real subagent round-trip, as claude-code-review does.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          UV_PYTHON_DOWNLOADS: never
        run: |
          [ -n "$ANTHROPIC_AUTH_TOKEN" ] || { echo "::error::MODEL_API_KEY secret is not set"; exit 1; }
          uv run --python 3.12 --no-group lint pytest tests/claude_code/ -v --no-cov -p no:cacheprovider
